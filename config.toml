# Nova 配置文件
# 三层加载优先级（低 → 高）：
#   1. 内置默认值
#   2. 全局启动配置：项目根或可执行文件旁 config.toml
#   3. 用户级：<nova_dir>/config.toml
#   4. 工作区级：<workspace>/.nova/config.toml
# 环境变量（OPENAI_API_KEY 等）始终最高优先级，仅运行时覆盖，不写盘。
#
# 字段留空表示继承上层。
# nova_dir 仅在全局启动配置或 NOVA_DIR 环境变量中生效；用户级/工作区级会忽略。
#
# 模型切换说明：
# - 不配置 [[model_profiles]] 时，所有 Agent 使用顶部默认模型
# - 配置 [[model_profiles]] 后，可在 Web UI 设置中为每个 Agent 分配不同模型
# - 也可在此文件直接为 Agent 指定 profile_id，不填则使用默认模型

# ============================
# 默认模型（fallback）
# ============================
openai_api_key = ""
openai_base_url = "https://api.deepseek.com"
openai_model = "deepseek-v4-pro"

# ============================
# 多模型配置
# 在 Web UI 设置 > 模型 中新增即可，重启后都会保留到这里。
# 也可手动在此添加，以下是几个常用示例：
# ============================

# [[model_profiles]]
# id = "deepseek"
# name = "DeepSeek"
# openai_api_key = ""
# openai_base_url = "https://api.deepseek.com"
# openai_model = "deepseek-v4-pro"

